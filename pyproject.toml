[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tui-movie-tv-tracker"
version = "0.1.0"
description = "A Textual TUI for tracking movies and TV shows you've watched"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
"anyio==4.14.2",
"certifi==2026.7.22",
"charset-normalizer==3.4.9",
"h11==0.16.0",
"httpcore==1.0.9",
"httpx==0.28.1",
"idna==3.18",
"linkify-it-py==2.1.0",
"markdown-it-py==4.2.0",
"mdit-py-plugins==0.6.1",
"mdurl==0.1.2",
"platformdirs==4.11.0",
"Pygments==2.20.0",
"python-dotenv==1.2.2",
"requests==2.34.2",
"rich==15.0.0",
"textual==8.2.8",
"typing_extensions==4.16.0",
"uc-micro-py==2.0.0",
"urllib3==2.7.0"
]

[project.scripts]
media-tracker = "tui_movie_tv_tracker.main:start"
